[package]
name = "rvl"
version = "0.10.0"
edition = "2024"
authors = ["CMD+RVL <engineering@cmdrvl.com>"]
description = "Reveal the smallest set of numeric changes that explain what actually changed."
license = "MIT"
repository = "https://github.com/cmdrvl/rvl"
readme = "README.md"
keywords = ["csv", "diff", "reconciliation", "cli", "numeric"]
categories = ["command-line-utilities"]

[[bin]]
name = "rvl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
# Pinned by exact rev. default-features = false: core's default turns on serde_json/float_roundtrip,
# which would change how this crate parses floats.
cmdrvl-core = { git = "https://github.com/cmdrvl/core", rev = "9cdf14a55f33fd8f426cbeb54fca478885239e7c", default-features = false }
# JSONL / Parquet / XLSX inputs (CSV and TSV keep rvl's own reader). Pinned by commit.
cmdrvl-tabular = { git = "https://github.com/cmdrvl/tabular", rev = "e83afb0ebe848a58c888cf619b105cbad19852e6", optional = true }

[features]
default = ["cli", "tabular", "zstd"]
cli = ["dep:clap"]
tabular = ["dep:cmdrvl-tabular"]
zstd = ["cmdrvl-tabular?/zstd"]

[dev-dependencies]
arrow-csv = "57.2.0"
arrow-schema = "57.2.0"
blake3 = "1"
jsonschema = "0.42"
polars = { version = "0.52.0", default-features = false, features = ["csv"] }
sha2 = "0.10"
simd-csv = "0.10.3"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "bakeoff"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
